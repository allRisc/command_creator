name: Publish Python Distro

on:
  push:
    tags:
      # PEP 440 version tags: N.N.N with an optional pre/post suffix (e.g. 3.0.0,
      # 3.0.0a1, 2.1.0rc0). Avoids firing on non-release tags.
      - '[0-9]+.[0-9]+.[0-9]+*'

# Least-privilege default; jobs that need more opt in below.
permissions:
  contents: read

jobs:
  # Gate the release on the full test suite (reuses test.yml).
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build Distro
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Build source tarball and wheel
        run: uv build
      - name: Store the distro packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python Distro to PyPI

    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/command_creator
    permissions:
      id-token: write  # Trusted publishing (OIDC); no API token needed.

    steps:
      - name: Download distro packages
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish Distro to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign the Python Distro and Upload to GitHub Releases

    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Create the release and upload assets.
      id-token: write  # Sigstore keyless signing (OIDC).

    steps:
    - name: Download all the distros
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --generate-notes
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
