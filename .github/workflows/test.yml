name: Tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  # Allow other workflows (e.g. publish.yml) to reuse this as a gate.
  workflow_call:

permissions:
  contents: read

jobs:
  tox:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per tox environment (see [tool.tox] in pyproject.toml).
        toxenv:
          - py314
          - style
          - typing
          - docs_dirhtml

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Run tox -e ${{ matrix.toxenv }}
        run: uv run tox -e ${{ matrix.toxenv }}
